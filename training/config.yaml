model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  max_length: 2048
  torch_dtype: "bfloat16"

qlora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  output_dir: "./checkpoints"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  evaluation_strategy: "steps"
  eval_steps: 500
  fp16: false
  bf16: true
  optim: "paged_adamw_32bit"
  lr_scheduler_type: "cosine"
  max_grad_norm: 0.3
  weight_decay: 0.01

dataset:
  train_file: "./dataset/train.jsonl"
  validation_file: "./dataset/validation.jsonl"
  test_file: "./dataset/test.jsonl"

export:
  output_dir: "./exports"
  format: "gguf"
